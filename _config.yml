title: "Vikram Bahure"
subtitle: "Economic Consultant · Markets · Geopolitics"
name: "Vikram Bahure"
description: "Economic consultant writing on finance, geopolitics, and applied economics. Opinion, analysis, and markets commentary."
url: "https://vikrambahure.github.io"
baseurl: ""
repository: "vikrambahure/vikrambahure.github.io"

remote_theme: "mmistakes/minimal-mistakes@4.26.2"
minimal_mistakes_skin: "air"

# Plugins
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-include-cache
  - jekyll-paginate

# Pagination
paginate: 8
paginate_path: /blog/page:num/

# Reading time
words_per_minute: 200

# Author
author:
  name: "Vikram Bahure"
  avatar: "/assets/images/bio-photo.jpg"
  bio: "Economic consultant. Quantitative modelling, technology economics, defence sector. Writing on finance, geopolitics, and markets. PhD, University of Geneva."
  location: "London, UK"
  email: "economics.vikram@gmail.com"
  links:
    - label: "Email"
      icon: "fas fa-fw fa-envelope-square"
      url: "mailto:economics.vikram@gmail.com"
    - label: "Google Scholar"
      icon: "fas fa-fw fa-graduation-cap"
      url: ""
    - label: "SSRN"
      icon: "fas fa-fw fa-file-alt"
      url: ""

# Site footer
footer:
  links:
    - label: "Email"
      icon: "fas fa-fw fa-envelope-square"
      url: "mailto:economics.vikram@gmail.com"

# Build settings
markdown: kramdown
highlighter: rouge
permalink: /:categories/:title/

include:
  - _pages

exclude:
  - _backup
  - "*.gemspec"
  - Gemfile
  - Gemfile.lock
  - vendor

# Category archive
category_archive:
  type: liquid
  path: /categories/

tag_archive:
  type: liquid
  path: /tags/

# Defaults
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      share: false
      related: true
      show_date: true
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true
