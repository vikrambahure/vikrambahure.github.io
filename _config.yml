title: "Vikram Bahure"
description: "London-based consulting economist writing on cross-asset macro, rates, FX, commodities, and volatility."
url: "https://vikrambahure.github.io"
baseurl: ""

# Author
author:
  name: "Vikram Bahure"
  email: "economics.vikram@gmail.com"
  location: "London, UK"

# Build
markdown: kramdown
highlighter: rouge
permalink: /:year/:month/:day/:title/

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

include:
  - _pages

exclude:
  - _backup
  - Gemfile
  - Gemfile.lock
  - vendor

# Defaults
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
