<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | normalize_whitespace | truncate: 160 }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  {% seo %}
  {% feed_meta %}
</head>
<body>

<nav class="site-nav" id="nav">
  <a href="/" class="nav-brand">{{ site.title }}</a>
  <ul class="nav-links">
    <li><a href="/about/">About</a></li>
    <li><a href="/consulting/">Consulting</a></li>
    <li><a href="/writing/">Writing</a></li>
  </ul>
</nav>

{{ content }}

<footer class="site-footer">
  <span>{{ site.title }} &nbsp;·&nbsp; {{ site.author.location }}</span>
  <span><a href="mailto:{{ site.author.email }}">Contact</a> &nbsp;·&nbsp; 2026</span>
</footer>

<script>
  const nav = document.getElementById('nav');
  window.addEventListener('scroll', () => {
    nav.classList.toggle('scrolled', window.scrollY > 60);
  });
</script>

</body>
</html>
