<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} &middot; {% endif %}{{ site.author.name }}</title>
  <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | normalize_whitespace | truncate: 160 }}">
  <link rel="stylesheet" href="{{ '/assets/css/editorial.css' | relative_url }}">
  {% seo %}
  {% feed_meta %}
  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-XW6DTP3L7H"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-XW6DTP3L7H');
  </script>
</head>
<body>
<div class="page">

  <header class="masthead">
    <a class="brand" href="{{ '/' | relative_url }}">{{ site.author.name }}</a>
    <div class="role">Economist <span class="dot">&middot;</span> {{ site.author.location }} <span class="dot">&middot;</span> Cross-Asset Macro Research</div>
  </header>

  <nav class="topnav">
    <span class="spacer"></span>
    <a href="https://www.linkedin.com/in/vikram-bahure/" target="_blank" rel="noopener">LinkedIn</a>
    <a href="mailto:{{ site.author.email }}">Email</a>
    <a href="{{ '/CV.pdf' | relative_url }}" class="cta">Curriculum Vitae &darr;</a>
  </nav>

  {{ content }}

  <footer class="site">
    <div>&copy; {{ site.author.name }} {{ site.time | date: "%Y" }} &nbsp;&middot;&nbsp; {{ site.author.location }}</div>
    <div class="links">
      <a href="{{ '/CV.pdf' | relative_url }}">CV</a>
      <a href="mailto:{{ site.author.email }}">Email</a>
      <a href="https://github.com/vikrambahure">GitHub</a>
      <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
    </div>
  </footer>

</div>
</body>
</html>
