<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | normalize_whitespace | truncate: 160 }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Source+Serif+4:ital,opsz,wght@0,8..60,300;0,8..60,400;1,8..60,300&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  {% seo %}
  {% feed_meta %}
</head>
<body>

<header class="masthead">
  <a class="site-brand" href="/">{{ site.title }}</a>
  <nav class="site-nav">
    <a href="/about/">About</a>
    <a href="/consulting/">Consulting</a>
    <a href="/opinion/">Opinion</a>
    <a href="/notes/">Notes</a>
    <a href="/trading/">Trading</a>
  </nav>
</header>

{{ content }}

<footer class="site-footer">
  {{ site.title }} &nbsp;·&nbsp; {{ site.author.location }} &nbsp;·&nbsp;
  <a href="mailto:{{ site.author.email }}">Contact</a>
</footer>

</body>
</html>
