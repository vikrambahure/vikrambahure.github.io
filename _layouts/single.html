---
layout: default
---

<header class="page-header">
  {% if page.categories %}
  <div class="page-kicker">{{ page.categories | first }}</div>
  {% endif %}
  <h1>{{ page.title }}</h1>
  {% if page.description %}
  <p class="page-lead">{{ page.description }}</p>
  {% endif %}
</header>

<article class="content">
  {{ content }}
</article>
